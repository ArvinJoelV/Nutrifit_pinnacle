services:
  # ---------------------------------------------------------------------------
  # Redis: In-Memory Caching & Pub/Sub Event Bus
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: nutrifit-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutrifit-net

  # ---------------------------------------------------------------------------
  # Apache Kafka & Zookeeper: Async Job Queue
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: nutrifit-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - nutrifit-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: nutrifit-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - nutrifit-net

  # ---------------------------------------------------------------------------
  # Backend API & Computer Vision Worker
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nutrifit-backend
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "9510:9510"
    environment:
      - PORT=9510
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - uploads_data:/app/static/uploads
    networks:
      - nutrifit-net

  # ---------------------------------------------------------------------------
  # Frontend Client (React + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nutrifit-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - nutrifit-net

volumes:
  redis_data:
  kafka_data:
  uploads_data:

networks:
  nutrifit-net:
    driver: bridge
